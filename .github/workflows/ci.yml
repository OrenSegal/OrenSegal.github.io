name: CI

on:
  pull_request:
  push:
    branches-ignore: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run lint

      - name: Build
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: The feed and the new sections were exported
        run: |
          test -s out/writing/feed.xml
          grep -q 'id="experience"' out/index.html
          grep -q 'id="now"' out/index.html
